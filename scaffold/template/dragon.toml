# Settings for this game. See the DragonMUD docs for every option.
name = "{{.Name}}"

# The dragon that greets you when the server starts and says goodbye when it
# stops. Set to false to turn it off.
dragon = true

# The built-in plugins this game loads. Remove one to leave it out, such as
# to write your own in game/ instead. They load in the engine's order, not
# the order listed here.
builtins = [
{{- range .Builtins}}
  "{{.}}",
{{- end}}
]

[telnet]
enabled = true
address = ":4000"
# Lines longer than this are wrapped between words. Set to 0 to leave
# wrapping to players' clients.
wrap = 80

[web]
address = ":8080"

[web.client]
enabled = true

# Where logs go. Add a [[log]] table per target, each with its own level
# (debug, info, warn, error) and format (plain, pretty, json).
[[log]]
target = "stderr"
format = "pretty"

# [[log]]
# target = "logs/game.log"
# level = "debug"
# format = "json"
